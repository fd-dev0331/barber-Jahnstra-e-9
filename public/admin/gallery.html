<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bregenz Barbershop</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1A1816">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/css/admin.css?v=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<a class="skip-link" href="#main" data-i18n="common.skipToContent"></a>
<noscript><p class="p-6 text-fg-body">JavaScript erforderlich · Требуется JavaScript · JavaScript gerekli</p></noscript>

<header data-shell data-app-header class="adm-header" hidden></header>
<div data-shell class="adm-layout" hidden>
  <aside data-app-sidebar class="adm-sidebar"></aside>
  <main id="main" class="adm-main">
    <div class="adm-container">
      <div class="adm-page-head">
        <div>
          <h1 class="adm-h1" data-i18n="nav.gallery"></h1>
          <p class="adm-subtitle" data-i18n="gallery.subtitle"></p>
        </div>
        <div class="adm-actions">
          <label class="adm-btn-primary relative cursor-pointer focus-within:ring-2 focus-within:ring-accent focus-within:ring-offset-2 focus-within:ring-offset-bg">
            <input type="file" multiple accept="image/jpeg,image/png,image/webp" data-upload-input
              class="absolute inset-0 h-full w-full cursor-pointer opacity-0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
            <span data-i18n="gallery.upload"></span>
          </label>
        </div>
      </div>

      <div class="adm-callout adm-callout-info mb-4">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5v.01"/></svg>
        <p class="min-w-0 flex-1" data-i18n="gallery.hint"></p>
      </div>

      <p class="mb-4 text-sm text-fg-body" data-upload-status aria-live="polite" hidden></p>

      <div data-list></div>
    </div>
  </main>
</div>

<dialog data-edit-dialog class="adm-dialog adm-dialog-narrow" aria-labelledby="gallery-edit-title">
  <form data-edit-form novalidate>
    <div class="adm-dialog-head">
      <h2 id="gallery-edit-title" class="adm-dialog-title" data-i18n="gallery.editTitle"></h2>
      <button type="button" class="adm-icon-btn adm-icon-btn-plain" data-close data-i18n-attr="aria-label:common.close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="adm-dialog-body grid gap-4">
      <p class="adm-form-error" data-form-error role="alert" hidden></p>
      <img data-edit-preview src="" alt="" class="aspect-square w-full rounded-md border border-line bg-bg object-cover">
      <div>
        <label class="adm-label" for="g-alt" data-i18n="gallery.alt"></label>
        <input class="adm-input" id="g-alt" name="alt" maxlength="200" autocomplete="off" data-i18n-attr="placeholder:gallery.altPlaceholder">
        <p class="adm-hint" data-i18n="gallery.altHint"></p>
      </div>
    </div>
    <div class="adm-dialog-foot">
      <button type="button" class="adm-btn-ghost" data-close data-i18n="common.cancel"></button>
      <button type="submit" class="adm-btn-primary" data-i18n="common.save"></button>
    </div>
  </form>
</dialog>

<div data-boot class="grid min-h-[60vh] place-items-center"><p class="text-sm text-fg-muted" data-i18n="common.loading"></p></div>
<p data-boot-error hidden class="mx-auto max-w-xl px-4 py-16 text-center text-fg-body" data-i18n="common.bootError"></p>

<script type="module" src="/assets/js/admin/gallery.js"></script>
</body>
</html>
