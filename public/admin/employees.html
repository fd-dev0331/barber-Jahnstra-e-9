<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bregenz Barbershop</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1A1816">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/css/admin.css?v=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<a class="skip-link" href="#main" data-i18n="common.skipToContent"></a>
<noscript><p class="p-6 text-fg-body">JavaScript erforderlich · Требуется JavaScript · JavaScript gerekli</p></noscript>

<header data-shell data-app-header class="adm-header" hidden></header>
<div data-shell class="adm-layout" hidden>
  <aside data-app-sidebar class="adm-sidebar"></aside>
  <main id="main" class="adm-main">
    <div class="adm-container">
      <div class="adm-page-head">
        <div>
          <h1 class="adm-h1" data-i18n="nav.employees"></h1>
          <p class="adm-subtitle" data-i18n="employees.subtitle"></p>
        </div>
        <div class="adm-actions">
          <button type="button" class="adm-btn-primary" data-new>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span data-i18n="employees.add"></span>
          </button>
        </div>
      </div>

      <div class="adm-callout adm-callout-info mb-4">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5v.01"/></svg>
        <p class="min-w-0 flex-1" data-i18n="employees.inactiveInfo"></p>
      </div>

      <div data-list></div>
    </div>
  </main>
</div>

<!-- Anlegen / Bearbeiten -->
<dialog data-edit-dialog class="adm-dialog adm-dialog-wide" aria-labelledby="edit-title">
  <form data-edit-form novalidate>
    <div class="adm-dialog-head">
      <h2 id="edit-title" class="adm-dialog-title" data-edit-title></h2>
      <button type="button" class="adm-icon-btn adm-icon-btn-plain" data-close data-i18n-attr="aria-label:common.close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="adm-dialog-body grid gap-6">
      <p class="adm-form-error" data-form-error role="alert" hidden></p>

      <fieldset class="adm-fieldset grid gap-4">
        <legend class="adm-legend" data-i18n="employees.sectionBasics"></legend>
        <div class="adm-grid-2">
          <div>
            <label class="adm-label" for="e-name" data-i18n="employees.name"></label>
            <input class="adm-input" id="e-name" name="name" maxlength="120" autocomplete="off">
          </div>
          <div>
            <label class="adm-label" for="e-role" data-i18n="employees.roleLabel"></label>
            <input class="adm-input" id="e-role" name="role" maxlength="120" autocomplete="off" data-i18n-attr="placeholder:employees.rolePlaceholder">
          </div>
        </div>
        <div class="adm-grid-2">
          <div>
            <label class="adm-label" for="e-calendar" data-i18n="employees.googleCalendar"></label>
            <select class="adm-input" id="e-calendar" name="googleCalendarId"></select>
            <p class="adm-hint" data-calendar-hint></p>
          </div>
          <div>
            <label class="adm-label" for="e-sort" data-i18n="common.sortOrder"></label>
            <input class="adm-input" id="e-sort" name="sortOrder" type="number" min="0" max="9999" inputmode="numeric">
            <p class="adm-hint" data-i18n="common.sortOrderHint"></p>
          </div>
        </div>
      </fieldset>

      <!-- Öffentliches Profil: erscheint im Team-Slider auf der Startseite. -->
      <fieldset class="adm-fieldset grid gap-4">
        <legend class="adm-legend" data-i18n="employees.sectionProfile"></legend>
        <p class="adm-hint mt-0" data-i18n="employees.profileHint"></p>
        <label class="adm-check-row">
          <input type="checkbox" name="showOnWebsite" class="adm-check">
          <span data-i18n="employees.showOnWebsite"></span>
        </label>
        <div class="grid gap-4 sm:grid-cols-[160px_minmax(0,1fr)]">
          <div data-field>
            <p class="adm-label" data-i18n="employees.photo"></p>
            <div data-photo-preview class="grid aspect-[3/4] w-full max-w-[160px] place-items-center overflow-hidden rounded-md border border-line bg-bg"></div>
            <div class="mt-2 flex flex-wrap gap-2">
              <label class="adm-btn-ghost adm-btn-sm relative cursor-pointer focus-within:ring-2 focus-within:ring-accent">
                <input type="file" accept="image/jpeg,image/png,image/webp" data-photo-input
                  class="absolute inset-0 h-full w-full cursor-pointer opacity-0">
                <span data-i18n="employees.photoChoose"></span>
              </label>
              <button type="button" class="adm-btn-ghost adm-btn-sm" data-photo-remove data-i18n="employees.photoRemove"></button>
            </div>
            <p class="adm-hint" data-photo-status aria-live="polite" data-i18n="employees.photoHint"></p>
          </div>
          <div class="grid content-start gap-4">
            <div>
              <label class="adm-label" for="e-headline" data-i18n="employees.headline"></label>
              <input class="adm-input" id="e-headline" name="headline" maxlength="120" autocomplete="off" data-i18n-attr="placeholder:employees.headlinePlaceholder">
            </div>
            <div>
              <label class="adm-label" for="e-bio" data-i18n="employees.bio"></label>
              <textarea class="adm-input" id="e-bio" name="bio" rows="5" maxlength="2000"></textarea>
              <p class="adm-hint" data-i18n="employees.bioHint"></p>
            </div>
            <div class="adm-grid-2">
              <div>
                <label class="adm-label" for="e-languages" data-i18n="employees.languages"></label>
                <input class="adm-input" id="e-languages" name="languages" maxlength="120" autocomplete="off" placeholder="DE, EN, AR, TR">
              </div>
              <div>
                <label class="adm-label" for="e-experience" data-i18n="employees.experienceYears"></label>
                <input class="adm-input tnum" id="e-experience" name="experienceYears" type="number" min="0" max="80" inputmode="numeric">
              </div>
            </div>
          </div>
        </div>
      </fieldset>

      <fieldset class="adm-fieldset">
        <legend class="adm-legend" data-i18n="employees.sectionServices"></legend>
        <p class="adm-hint mb-2 mt-0" data-i18n="employees.servicesHint"></p>
        <div data-services class="grid gap-x-4 sm:grid-cols-2"></div>
      </fieldset>

      <fieldset class="adm-fieldset">
        <legend class="adm-legend" data-i18n="employees.sectionHours"></legend>
        <p class="adm-hint mb-3 mt-0" data-i18n="employees.hoursHint"></p>
        <div data-hours class="grid gap-2"></div>
      </fieldset>
    </div>
    <div class="adm-dialog-foot">
      <button type="button" class="adm-btn-ghost" data-close data-i18n="common.cancel"></button>
      <button type="submit" class="adm-btn-primary" data-i18n="common.save"></button>
    </div>
  </form>
</dialog>

<!-- Abwesenheit -->
<dialog data-absence-dialog class="adm-dialog adm-dialog-narrow" aria-labelledby="absence-title">
  <form data-absence-form novalidate>
    <div class="adm-dialog-head">
      <h2 id="absence-title" class="adm-dialog-title" data-absence-title></h2>
      <button type="button" class="adm-icon-btn adm-icon-btn-plain" data-close data-i18n-attr="aria-label:common.close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="adm-dialog-body grid gap-4">
      <p class="adm-hint mt-0" data-i18n="employees.absenceHint"></p>
      <p class="adm-form-error" data-form-error role="alert" hidden></p>
      <div class="adm-grid-2">
        <div>
          <label class="adm-label" for="a-from" data-i18n="bookings.from"></label>
          <input class="adm-input" id="a-from" name="from" type="date">
        </div>
        <div>
          <label class="adm-label" for="a-to" data-i18n="employees.toInclusive"></label>
          <input class="adm-input" id="a-to" name="to" type="date">
        </div>
      </div>
      <div>
        <label class="adm-label" for="a-kind" data-i18n="employees.absenceKind"></label>
        <select class="adm-input" id="a-kind" name="kind"></select>
      </div>
      <div>
        <label class="adm-label" for="a-note" data-i18n="employees.absenceNote"></label>
        <input class="adm-input" id="a-note" name="note" maxlength="300" autocomplete="off">
      </div>
    </div>
    <div class="adm-dialog-foot">
      <button type="button" class="adm-btn-ghost" data-close data-i18n="common.cancel"></button>
      <button type="submit" class="adm-btn-primary" data-i18n="common.save"></button>
    </div>
  </form>
</dialog>

<div data-boot class="grid min-h-[60vh] place-items-center"><p class="text-sm text-fg-muted" data-i18n="common.loading"></p></div>
<p data-boot-error hidden class="mx-auto max-w-xl px-4 py-16 text-center text-fg-body" data-i18n="common.bootError"></p>

<script type="module" src="/assets/js/admin/employees.js"></script>
</body>
</html>
