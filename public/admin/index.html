<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bregenz Barbershop</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1A1816">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/css/admin.css?v=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<a class="skip-link" href="#main" data-i18n="common.skipToContent"></a>
<noscript><p class="p-6 text-fg-body">JavaScript erforderlich · Требуется JavaScript · JavaScript gerekli</p></noscript>

<!-- Anmeldung / Ersteinrichtung. Welche der beiden Ansichten erscheint,
     entscheidet der Server über GET /api/admin/setup — nicht dieses Skript. -->
<div data-gate hidden class="flex min-h-screen flex-col">
  <header class="adm-header">
    <div class="adm-header-inner">
      <div class="adm-brand">
        <span class="adm-brand-mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.1 8.1 20 20M8.1 15.9 20 4"/></svg></span>
        <span class="adm-brand-text">
          <span class="adm-brand-name">Bregenz Barbershop</span>
          <span class="adm-brand-sub" data-i18n="shell.adminArea"></span>
        </span>
      </div>
      <div data-lang-slot></div>
    </div>
  </header>

  <main id="gate-main" class="flex flex-1 justify-center px-4 pb-16 pt-10 sm:pt-20">
    <div class="w-full max-w-[420px]">
      <section data-view="login" hidden class="adm-card adm-card-pad">
        <h1 class="adm-h1" data-i18n="login.title"></h1>
        <p class="adm-subtitle" data-i18n="login.subtitle"></p>
        <form data-form="login" novalidate class="mt-6 grid gap-4">
          <p class="adm-form-error" data-form-error role="alert" hidden></p>
          <div>
            <label class="adm-label" for="login-email" data-i18n="login.email"></label>
            <input class="adm-input" id="login-email" name="email" type="email" inputmode="email" autocomplete="username">
          </div>
          <div>
            <label class="adm-label" for="login-password" data-i18n="login.password"></label>
            <input class="adm-input" id="login-password" name="password" type="password" autocomplete="current-password">
          </div>
          <button class="adm-btn-primary adm-btn-block mt-2" type="submit" data-i18n="login.submit"></button>
          <p class="adm-hint text-center" data-i18n="login.forgotHint"></p>
        </form>
      </section>

      <!-- Telegram Mini App: erscheint nur, wenn dieses Telegram-Konto noch mit
           keinem Zugang verknüpft ist. Danach genügt der Start im Bot. -->
      <section data-view="telegram" hidden class="adm-card adm-card-pad">
        <h1 class="adm-h1" data-i18n="telegram.gateTitle"></h1>
        <p class="adm-subtitle" data-i18n="telegram.gateSubtitle"></p>
        <p class="adm-hint" data-telegram-user hidden></p>
        <form data-form="telegram" novalidate class="mt-6 grid gap-4">
          <p class="adm-form-error" data-form-error role="alert" hidden></p>
          <div>
            <label class="adm-label" for="tg-email" data-i18n="login.email"></label>
            <input class="adm-input" id="tg-email" name="email" type="email" inputmode="email" autocomplete="username">
          </div>
          <div>
            <label class="adm-label" for="tg-password" data-i18n="login.password"></label>
            <input class="adm-input" id="tg-password" name="password" type="password" autocomplete="current-password">
          </div>
          <button class="adm-btn-primary adm-btn-block mt-2" type="submit" data-i18n="telegram.connect"></button>
          <p class="adm-hint text-center" data-i18n="telegram.gateHint"></p>
        </form>
      </section>

      <section data-view="setup" hidden class="adm-card adm-card-pad">
        <h1 class="adm-h1" data-i18n="setup.title"></h1>
        <p class="adm-subtitle" data-i18n="setup.subtitle"></p>
        <form data-form="setup" novalidate class="mt-6 grid gap-4">
          <p class="adm-form-error" data-form-error role="alert" hidden></p>
          <div>
            <label class="adm-label" for="setup-business" data-i18n="setup.businessName"></label>
            <input class="adm-input" id="setup-business" name="businessName" value="Bregenz Barbershop" autocomplete="organization">
          </div>
          <div>
            <label class="adm-label" for="setup-name" data-i18n="setup.ownerName"></label>
            <input class="adm-input" id="setup-name" name="ownerName" autocomplete="name">
          </div>
          <div>
            <label class="adm-label" for="setup-email" data-i18n="login.email"></label>
            <input class="adm-input" id="setup-email" name="email" type="email" inputmode="email" autocomplete="username">
          </div>
          <div>
            <label class="adm-label" for="setup-password" data-i18n="login.password"></label>
            <input class="adm-input" id="setup-password" name="password" type="password" autocomplete="new-password" aria-describedby="setup-password-hint">
            <p class="adm-hint" id="setup-password-hint" data-i18n="validation.passwordHint"></p>
          </div>
          <button class="adm-btn-primary adm-btn-block mt-2" type="submit" data-i18n="setup.submit"></button>
        </form>
      </section>
    </div>
  </main>
</div>

<header data-shell data-app-header class="adm-header" hidden></header>
<div data-shell class="adm-layout" hidden>
  <aside data-app-sidebar class="adm-sidebar"></aside>
  <main id="main" class="adm-main">
    <div class="adm-container">
      <div class="adm-page-head">
        <div>
          <h1 class="adm-h1" data-i18n="nav.dashboard"></h1>
          <p class="adm-subtitle" data-today-label></p>
        </div>
        <div class="adm-actions" data-quick></div>
      </div>

      <div data-error></div>
      <div data-hints class="mb-5 grid gap-2.5 empty:hidden"></div>
      <div data-stats class="grid grid-cols-2 gap-3 md:grid-cols-3 xl:grid-cols-5"></div>

      <div class="mt-6 grid gap-6 xl:grid-cols-2">
        <section class="min-w-0" aria-labelledby="today-title">
          <div class="mb-3 flex items-center justify-between gap-3">
            <h2 id="today-title" class="adm-h2" data-i18n="dashboard.today"></h2>
            <a class="adm-link text-[13px]" href="/admin/calendar" data-i18n="dashboard.openCalendar"></a>
          </div>
          <div data-today></div>
        </section>
        <section class="min-w-0" aria-labelledby="upcoming-title">
          <div class="mb-3 flex items-center justify-between gap-3">
            <h2 id="upcoming-title" class="adm-h2" data-i18n="dashboard.upcoming"></h2>
            <a class="adm-link text-[13px]" href="/admin/bookings?view=upcoming" data-i18n="dashboard.allBookings"></a>
          </div>
          <div data-upcoming></div>
        </section>
      </div>
    </div>
  </main>
</div>

<div data-boot class="grid min-h-[60vh] place-items-center"><p class="text-sm text-fg-muted" data-i18n="common.loading"></p></div>
<p data-boot-error hidden class="mx-auto max-w-xl px-4 py-16 text-center text-fg-body" data-i18n="common.bootError"></p>

<script type="module" src="/assets/js/admin/dashboard.js"></script>
</body>
</html>
