<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalender – Bregenz Barbershop</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E0D0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@700&display=swap">
<link rel="stylesheet" href="/assets/css/site.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="min-h-screen">
<a class="skip-link" href="#main">Zum Inhalt springen</a>

<header data-shell hidden class="border-b border-line bg-surface">
  <div class="mx-auto w-full max-w-container px-4">
    <div class="flex h-16 items-center justify-between gap-4">
      <a href="/admin" class="font-display text-lg font-bold uppercase tracking-wide text-fg">Barbershop <span class="text-accent">Verwaltung</span></a>
      <div class="flex items-center gap-3 text-sm">
        <p data-user class="hidden sm:block"></p>
        <button type="button" data-logout class="btn-ghost min-h-[40px] px-4 py-2 text-[13px]">Abmelden</button>
      </div>
    </div>
    <nav data-nav aria-label="Verwaltung" class="-mb-px flex gap-1 overflow-x-auto"></nav>
  </div>
</header>

<main id="main" data-shell hidden class="mx-auto w-full max-w-container px-4 py-8">
  <h1 class="font-display text-h2 font-bold uppercase text-fg">Kalender</h1>
  <hr class="rule">

  <div class="mb-6 flex flex-wrap items-center gap-3">
    <button type="button" class="btn-ghost min-h-[44px] px-4 py-2" data-prev>← Woche</button>
    <p data-range class="tnum min-w-[220px] text-center font-semibold text-fg"></p>
    <button type="button" class="btn-ghost min-h-[44px] px-4 py-2" data-next>Woche →</button>
    <button type="button" class="btn-secondary min-h-[44px] px-4 py-2" data-today>Heute</button>
  </div>

  <div data-week class="grid gap-4 md:grid-cols-7"></div>
</main>

<p data-boot-error hidden class="mx-auto max-w-container px-4 py-16 text-fg-body">
  Die Verwaltung ist gerade nicht erreichbar. Bitte lade die Seite neu.
</p>

<script type="module" src="/assets/js/admin/calendar.js"></script>
</body>
</html>
