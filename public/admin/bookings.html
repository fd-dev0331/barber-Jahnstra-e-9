<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bregenz Barbershop</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1A1816">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/css/admin.css?v=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<a class="skip-link" href="#main" data-i18n="common.skipToContent"></a>
<noscript><p class="p-6 text-fg-body">JavaScript erforderlich · Требуется JavaScript · JavaScript gerekli</p></noscript>

<header data-shell data-app-header class="adm-header" hidden></header>
<div data-shell class="adm-layout" hidden>
  <aside data-app-sidebar class="adm-sidebar"></aside>
  <main id="main" class="adm-main">
    <div class="adm-container">
      <div class="adm-page-head">
        <div>
          <h1 class="adm-h1" data-i18n="nav.bookings"></h1>
          <p class="adm-subtitle" data-i18n="bookings.subtitle"></p>
        </div>
        <div class="adm-actions">
          <button type="button" class="adm-btn-primary" data-new hidden>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span data-i18n="bookings.new"></span>
          </button>
        </div>
      </div>

      <form data-filters class="adm-card adm-card-pad mb-4 grid gap-4" role="search" novalidate>
        <div class="adm-seg" role="group" data-i18n-attr="aria-label:bookings.period">
          <button type="button" class="adm-seg-btn" data-view="upcoming" data-i18n="bookings.viewUpcoming"></button>
          <button type="button" class="adm-seg-btn" data-view="today" data-i18n="bookings.viewToday"></button>
          <button type="button" class="adm-seg-btn" data-view="past" data-i18n="bookings.viewPast"></button>
          <button type="button" class="adm-seg-btn" data-view="all" data-i18n="bookings.viewAll"></button>
        </div>
        <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
          <div class="sm:col-span-2 lg:col-span-4 xl:col-span-2">
            <label class="adm-label" for="f-q" data-i18n="bookings.search"></label>
            <input class="adm-input" id="f-q" name="q" type="search" maxlength="60" data-i18n-attr="placeholder:bookings.searchPlaceholder">
          </div>
          <div>
            <label class="adm-label" for="f-status" data-i18n="bookings.colStatus"></label>
            <select class="adm-input" id="f-status" name="status"></select>
          </div>
          <div data-employee-filter hidden>
            <label class="adm-label" for="f-employee" data-i18n="bookings.colEmployee"></label>
            <select class="adm-input" id="f-employee" name="employeeId"></select>
          </div>
          <div>
            <label class="adm-label" for="f-from" data-i18n="bookings.from"></label>
            <input class="adm-input" id="f-from" name="from" type="date">
          </div>
          <div>
            <label class="adm-label" for="f-to" data-i18n="bookings.to"></label>
            <input class="adm-input" id="f-to" name="to" type="date">
          </div>
        </div>
        <div class="flex flex-wrap items-center justify-between gap-2">
          <p class="text-[13px] text-fg-muted" data-count aria-live="polite"></p>
          <div class="flex flex-wrap gap-2">
            <button type="button" class="adm-btn-ghost adm-btn-sm" data-reset data-i18n="common.reset"></button>
            <button type="submit" class="adm-btn-secondary adm-btn-sm" data-i18n="common.apply"></button>
          </div>
        </div>
      </form>

      <div data-results></div>
    </div>
  </main>
</div>

<!-- Termindetails -->
<dialog data-detail-dialog class="adm-dialog" aria-labelledby="detail-title">
  <div class="adm-dialog-head">
    <h2 id="detail-title" class="adm-dialog-title" data-i18n="bookings.detailTitle"></h2>
    <button type="button" class="adm-icon-btn adm-icon-btn-plain" data-close data-i18n-attr="aria-label:common.close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="adm-dialog-body" data-detail-body></div>
  <div class="adm-dialog-foot">
    <button type="button" class="adm-btn-ghost" data-close data-i18n="common.close"></button>
  </div>
</dialog>

<!-- Manueller Termin: dieselbe Prüfung und derselbe Kalender wie eine Website-Buchung -->
<dialog data-new-dialog class="adm-dialog" aria-labelledby="new-title">
  <form data-new-form novalidate>
    <div class="adm-dialog-head">
      <h2 id="new-title" class="adm-dialog-title" data-i18n="bookings.newTitle"></h2>
      <button type="button" class="adm-icon-btn adm-icon-btn-plain" data-close data-i18n-attr="aria-label:common.close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="adm-dialog-body grid gap-4">
      <p class="adm-hint mt-0" data-i18n="bookings.newHint"></p>
      <p class="adm-form-error" data-form-error role="alert" hidden></p>
      <div class="adm-grid-2">
        <div>
          <label class="adm-label" for="n-service" data-i18n="bookings.colService"></label>
          <select class="adm-input" id="n-service" name="serviceId"></select>
        </div>
        <div>
          <label class="adm-label" for="n-employee" data-i18n="bookings.colEmployee"></label>
          <select class="adm-input" id="n-employee" name="employeeId"></select>
        </div>
      </div>
      <div class="adm-grid-2">
        <div>
          <label class="adm-label" for="n-date" data-i18n="bookings.colDate"></label>
          <input class="adm-input" id="n-date" name="date" type="date">
        </div>
        <div>
          <label class="adm-label" for="n-time" data-i18n="bookings.colTime"></label>
          <input class="adm-input" id="n-time" name="time" type="time" step="300">
        </div>
      </div>
      <div>
        <p class="adm-label" data-i18n="bookings.freeSlots"></p>
        <div data-slots class="flex max-h-44 flex-wrap gap-2 overflow-y-auto"></div>
      </div>
      <div>
        <label class="adm-label" for="n-name" data-i18n="bookings.customerName"></label>
        <input class="adm-input" id="n-name" name="customerName" autocomplete="off" maxlength="120">
      </div>
      <div class="adm-grid-2">
        <div>
          <label class="adm-label" for="n-phone" data-i18n="bookings.phone"></label>
          <input class="adm-input" id="n-phone" name="customerPhone" type="tel" autocomplete="off" maxlength="40">
        </div>
        <div>
          <label class="adm-label" for="n-email" data-i18n="bookings.emailOptional"></label>
          <input class="adm-input" id="n-email" name="customerEmail" type="email" inputmode="email" autocomplete="off" maxlength="200">
        </div>
      </div>
      <div>
        <label class="adm-label" for="n-note" data-i18n="bookings.note"></label>
        <textarea class="adm-input" id="n-note" name="note" rows="2" maxlength="500"></textarea>
      </div>
      <label class="adm-check-row" data-outside-hours hidden>
        <input type="checkbox" name="allowOutsideHours" class="adm-check">
        <span data-i18n="bookings.outsideHours"></span>
      </label>
    </div>
    <div class="adm-dialog-foot">
      <button type="button" class="adm-btn-ghost" data-close data-i18n="common.cancel"></button>
      <button type="submit" class="adm-btn-primary" data-i18n="bookings.create"></button>
    </div>
  </form>
</dialog>

<div data-boot class="grid min-h-[60vh] place-items-center"><p class="text-sm text-fg-muted" data-i18n="common.loading"></p></div>
<p data-boot-error hidden class="mx-auto max-w-xl px-4 py-16 text-center text-fg-body" data-i18n="common.bootError"></p>

<script type="module" src="/assets/js/admin/bookings.js"></script>
</body>
</html>
