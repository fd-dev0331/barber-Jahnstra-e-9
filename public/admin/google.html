<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google – Bregenz Barbershop</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E0D0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@700&display=swap">
<link rel="stylesheet" href="/assets/css/site.css?v=2">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="min-h-screen">
<a class="skip-link" href="#main">Zum Inhalt springen</a>

<header data-shell hidden class="border-b border-line bg-surface">
  <div class="mx-auto w-full max-w-container px-4">
    <div class="flex h-16 items-center justify-between gap-4">
      <a href="/admin" class="font-display text-lg font-bold uppercase tracking-wide text-fg">Barbershop <span class="text-accent">Verwaltung</span></a>
      <div class="flex items-center gap-3 text-sm">
        <p data-user class="hidden sm:block"></p>
        <button type="button" data-logout class="btn-ghost min-h-[40px] px-4 py-2 text-[13px]">Abmelden</button>
      </div>
    </div>
    <nav data-nav aria-label="Verwaltung" class="-mb-px flex gap-1 overflow-x-auto"></nav>
  </div>
</header>

<main id="main" data-shell hidden class="mx-auto w-full max-w-container px-4 py-8">
  <h1 class="font-display text-h2 font-bold uppercase text-fg">Google Kalender</h1>
  <hr class="rule">

  <div data-status class="grid gap-4"></div>

  <section class="mt-10">
    <h2 class="font-display text-xl font-bold uppercase text-fg">Kalender je Mitarbeiter</h2>
    <p class="field-hint mb-4">Ein Google-Konto des Betriebs, pro Mitarbeiter ein eigener Kalender.</p>
    <div data-assign class="grid gap-3"></div>
  </section>

  <section class="mt-10">
    <h2 class="font-display text-xl font-bold uppercase text-fg">Einrichtung in der Google Cloud Console</h2>
    <div data-setup-help class="mt-4 grid gap-3 text-[15px] text-fg-body"></div>
  </section>
</main>

<p data-boot-error hidden class="mx-auto max-w-container px-4 py-16 text-fg-body">
  Die Verwaltung ist gerade nicht erreichbar. Bitte lade die Seite neu.
</p>

<script type="module" src="/assets/js/admin/google.js"></script>
</body>
</html>
