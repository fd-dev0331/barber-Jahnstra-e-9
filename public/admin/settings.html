<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bregenz Barbershop</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1A1816">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/css/admin.css?v=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<a class="skip-link" href="#main" data-i18n="common.skipToContent"></a>
<noscript><p class="p-6 text-fg-body">JavaScript erforderlich · Требуется JavaScript · JavaScript gerekli</p></noscript>

<header data-shell data-app-header class="adm-header" hidden></header>
<div data-shell class="adm-layout" hidden>
  <aside data-app-sidebar class="adm-sidebar"></aside>
  <main id="main" class="adm-main">
    <div class="adm-container max-w-[960px]">
      <div class="adm-page-head">
        <div>
          <h1 class="adm-h1" data-i18n="nav.settings"></h1>
          <p class="adm-subtitle" data-i18n="settings.subtitle"></p>
        </div>
      </div>

      <div class="grid gap-4">
        <section class="adm-card" aria-labelledby="account-title">
          <div class="adm-card-head"><h2 id="account-title" class="adm-h2" data-i18n="settings.account"></h2></div>
          <div class="adm-card-pad" data-account></div>
        </section>

        <section class="adm-card" aria-labelledby="language-title">
          <div class="adm-card-head"><h2 id="language-title" class="adm-h2" data-i18n="settings.language"></h2></div>
          <div class="adm-card-pad">
            <fieldset class="adm-fieldset">
              <legend class="adm-hint mb-2 mt-0" data-i18n="settings.languageHint"></legend>
              <div data-languages class="grid gap-2 sm:grid-cols-3"></div>
            </fieldset>
          </div>
        </section>

        <section class="adm-card" aria-labelledby="security-title">
          <div class="adm-card-head"><h2 id="security-title" class="adm-h2" data-i18n="settings.security"></h2></div>
          <form data-password-form novalidate class="adm-card-pad grid gap-4">
            <p class="adm-form-error" data-form-error role="alert" hidden></p>
            <div>
              <label class="adm-label" for="p-current" data-i18n="settings.currentPassword"></label>
              <input class="adm-input" id="p-current" name="currentPassword" type="password" autocomplete="current-password">
            </div>
            <div class="adm-grid-2">
              <div>
                <label class="adm-label" for="p-new" data-i18n="settings.newPassword"></label>
                <input class="adm-input" id="p-new" name="newPassword" type="password" autocomplete="new-password" aria-describedby="p-new-hint">
                <p class="adm-hint" id="p-new-hint" data-i18n="validation.passwordHint"></p>
              </div>
              <div>
                <label class="adm-label" for="p-repeat" data-i18n="settings.repeatPassword"></label>
                <input class="adm-input" id="p-repeat" name="repeatPassword" type="password" autocomplete="new-password">
              </div>
            </div>
            <p class="adm-hint mt-0" data-i18n="settings.passwordSessionsHint"></p>
            <div class="flex justify-end">
              <button type="submit" class="adm-btn-primary" data-i18n="settings.changePassword"></button>
            </div>
          </form>
        </section>

        <section class="adm-card" data-owner-only hidden aria-labelledby="users-title">
          <div class="adm-card-head">
            <h2 id="users-title" class="adm-h2" data-i18n="settings.users"></h2>
            <button type="button" class="adm-btn-secondary adm-btn-sm" data-new-user>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              <span data-i18n="settings.addUser"></span>
            </button>
          </div>
          <div class="adm-card-pad grid gap-3">
            <p class="adm-hint mt-0" data-i18n="settings.usersHint"></p>
            <div data-users class="grid gap-2"></div>
          </div>
        </section>

        <section class="adm-card" aria-labelledby="logout-title">
          <div class="adm-card-head"><h2 id="logout-title" class="adm-h2" data-i18n="shell.logout"></h2></div>
          <div class="adm-card-pad flex flex-wrap items-center justify-between gap-3">
            <p class="text-sm text-fg-body" data-i18n="settings.logoutHint"></p>
            <button type="button" class="adm-btn-ghost" data-logout>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg>
              <span data-i18n="shell.logout"></span>
            </button>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>

<dialog data-user-dialog class="adm-dialog adm-dialog-narrow" aria-labelledby="user-title">
  <form data-user-form novalidate>
    <div class="adm-dialog-head">
      <h2 id="user-title" class="adm-dialog-title" data-i18n="settings.addUser"></h2>
      <button type="button" class="adm-icon-btn adm-icon-btn-plain" data-close data-i18n-attr="aria-label:common.close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="adm-dialog-body grid gap-4">
      <p class="adm-hint mt-0" data-i18n="settings.addUserHint"></p>
      <p class="adm-form-error" data-form-error role="alert" hidden></p>
      <div>
        <label class="adm-label" for="u-name" data-i18n="employees.name"></label>
        <input class="adm-input" id="u-name" name="name" maxlength="120" autocomplete="off">
      </div>
      <div>
        <label class="adm-label" for="u-email" data-i18n="login.email"></label>
        <input class="adm-input" id="u-email" name="email" type="email" inputmode="email" maxlength="200" autocomplete="off">
      </div>
      <div>
        <label class="adm-label" for="u-password" data-i18n="login.password"></label>
        <input class="adm-input" id="u-password" name="password" type="password" autocomplete="new-password">
        <p class="adm-hint" data-i18n="validation.passwordHint"></p>
      </div>
      <div>
        <label class="adm-label" for="u-role" data-i18n="settings.role"></label>
        <select class="adm-input" id="u-role" name="role"></select>
      </div>
      <div>
        <label class="adm-label" for="u-employee" data-i18n="settings.linkedEmployee"></label>
        <select class="adm-input" id="u-employee" name="employeeId"></select>
        <p class="adm-hint" data-i18n="settings.linkedEmployeeHint"></p>
      </div>
    </div>
    <div class="adm-dialog-foot">
      <button type="button" class="adm-btn-ghost" data-close data-i18n="common.cancel"></button>
      <button type="submit" class="adm-btn-primary" data-i18n="common.create"></button>
    </div>
  </form>
</dialog>

<div data-boot class="grid min-h-[60vh] place-items-center"><p class="text-sm text-fg-muted" data-i18n="common.loading"></p></div>
<p data-boot-error hidden class="mx-auto max-w-xl px-4 py-16 text-center text-fg-body" data-i18n="common.bootError"></p>

<script type="module" src="/assets/js/admin/settings.js"></script>
</body>
</html>
